name: CI

on:
  push:
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Python tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install pinned project dependencies
        run: python -m pip install -r requirements.txt

      - name: Run full test suite
        run: python -m pytest -q

  docker-validation:
    name: Docker validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

      - name: Build Docker images
        run: docker compose build

      - name: Start the local workbench without provider keys
        run: docker compose up --detach --no-build --wait --wait-timeout 90

      - name: Check the backend and Streamlit
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8000/api/health
          curl --fail --silent --show-error --retry 10 --retry-connrefused http://127.0.0.1:8501/_stcore/health

      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop the local workbench
        if: always()
        run: docker compose down --volumes
