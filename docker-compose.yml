services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-}
      INTERNSCOUT_EMBEDDING_API_KEY: ${INTERNSCOUT_EMBEDDING_API_KEY:-}
      INTERNSCOUT_EMBEDDING_BASE_URL: ${INTERNSCOUT_EMBEDDING_BASE_URL:-}
      INTERNSCOUT_EMBEDDING_MODEL: ${INTERNSCOUT_EMBEDDING_MODEL:-text-embedding-v4}
      INTERNSCOUT_EMBEDDING_DIMENSIONS: ${INTERNSCOUT_EMBEDDING_DIMENSIONS:-1024}
      INTERNSCOUT_DATABASE_URL: sqlite:////data/internscout.db
    ports:
      - "8000:8000"
    volumes:
      - backend_data:/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  demo:
    build:
      context: .
      dockerfile: Dockerfile.demo
    environment:
      INTERNSCOUT_API_BASE_URL: http://backend:8000
      INTERNSCOUT_API_TIMEOUT_SECONDS: "60"
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8501:8501"

volumes:
  backend_data:
